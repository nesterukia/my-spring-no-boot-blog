services:
  db:
    image: 'postgres:13.1-alpine'
    container_name: blog-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=blog-db
    volumes:
      - ./db_init:/docker-entrypoint-initdb.d/
      - postgres-data:/var/lib/postgres/data
    ports:
      - "5432:5432"
volumes:
  postgres-data: